name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "server never became ready:"; cat /tmp/server.log; exit 1

      # scripts/verify.sh is the SINGLE source of truth for the acceptance
      # contract — the same command runs locally and against production.
      # On localhost it asserts code contracts only; readiness (legal fields,
      # Stripe links) is asserted separately against the live https origin.
      - name: Acceptance contract
        run: npm run verify

      # Use the runner image's own ChromeDriver, which is version-matched to
      # its bundled Chrome. npm's chromedriver package tracks Chrome stable and
      # drifts ahead of the image (152 vs 151), which is what broke PR #3.
      - name: Accessibility (axe)
        run: |
          DRIVER="${CHROMEWEBDRIVER:-/usr/local/share/chromedriver-linux64}/chromedriver"
          if [ ! -x "$DRIVER" ]; then
            echo "::error::no version-matched chromedriver on this runner (looked in '$DRIVER')"
            exit 1
          fi
          "$DRIVER" --version
          npx --yes @axe-core/cli@4 --exit --chromedriver-path "$DRIVER" \
            http://localhost:3000/ \
            http://localhost:3000/work \
            http://localhost:3000/work/cim-threma \
            http://localhost:3000/capabilities \
            http://localhost:3000/simulator \
            http://localhost:3000/payments \
            http://localhost:3000/connect \
            http://localhost:3000/card \
            http://localhost:3000/impressum \
            http://localhost:3000/datenschutz

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/server.pid)" 2>/dev/null || true

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI (gates in lighthouserc.json)
        run: npx --yes @lhci/cli@0.14.x autorun
